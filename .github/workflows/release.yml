name: Release Kraken Gradle Plugin

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  release:
    environment: prod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # version.txt is released as-is the first time; after that each push releases the next patch of its major.minor.
      - name: Calculate version
        run: |
          BASE_VERSION=$(cat version.txt | tr -d '[:space:]')
          MAJOR_MINOR=$(echo $BASE_VERSION | cut -d. -f1,2)

          if git rev-parse "refs/tags/${BASE_VERSION}" >/dev/null 2>&1; then
            LAST_TAG=$(git tag -l "${MAJOR_MINOR}.*" --sort=-version:refname | head -n 1)
            LAST_PATCH=$(echo $LAST_TAG | awk -F. '{print $NF}')
            PATCH=$((LAST_PATCH + 1))
            VERSION="${MAJOR_MINOR}.${PATCH}"
          else
            VERSION="${BASE_VERSION}"
          fi

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Calculated version: $VERSION"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Build project
        run: |
          echo "Building project with version $VERSION"
          chmod +x ./gradlew
          ./gradlew clean build

      - name: Collect commit messages since last tag
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s")
          else
            COMMITS=$(git log ${LAST_TAG}..HEAD --pretty=format:"- %s")
          fi
          echo "COMMITS<<EOF" >> $GITHUB_ENV
          echo "$COMMITS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      # Publishes the plugin jar and the com.krakenplugins.plugin marker that resolves the plugin id, in a Maven
      # repository layout served as https://repo.kraken-plugins.com. The build directory starts clean, so
      # maven-metadata.xml lists only this release; older version directories stay in the bucket, so builds pinned to
      # an older version still resolve.
      - name: Publish Maven repository to SeaweedFS
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SEAWEED_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SEAWEED_SECRET_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          # SeaweedFS's S3 gateway rejects the CRC32 trailer the AWS CLI adds by default.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          ./gradlew publishAllPublicationsToStagingRepository
          aws s3 cp build/maven-repo s3://kraken-bootstrap-static/maven/ \
            --recursive \
            --endpoint-url ${{ secrets.SEAWEED_URL }}

      # Tagged after publishing, so a failed upload is retried with the same version on the next run.
      - name: Create Git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${VERSION}" -m "Release ${VERSION}"
          git push origin "${VERSION}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Release ${{ env.VERSION }}
          body: ${{ env.COMMITS }}
          make_latest: true
